<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente de facturas</title>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F5F7;
    --surface: #FFFFFF;
    --border: #E1E4EA;
    --ink: #1A2332;
    --slate: #5C6672;
    --slate-light: #8992A0;
    --accent: #2B4C7E;
    --accent-dark: #1D3A63;
    --success: #1F7A54;
    --success-bg: #E7F5EE;
    --success-border: #A9D9C3;
    --danger: #B33F32;
    --danger-bg: #FBEAE7;
    --danger-border: #EFC0B7;
    --warning: #8A5A12;
    --warning-bg: #FBF1DF;
    --warning-border: #E8C878;
    --font-display: 'Source Serif 4', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Consolas', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 32px 32px;
    background-position: -1px -1px;
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 48px 20px;
  }

  .wrap {
    max-width: 620px;
    margin: 0 auto;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--slate);
    margin: 0 0 10px;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 30px;
    margin: 0 0 6px;
    color: var(--ink);
  }

  .subtitulo {
    color: var(--slate);
    font-size: 14.5px;
    margin: 0 0 32px;
    line-height: 1.5;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 1px 2px rgba(26, 35, 50, 0.04);
  }

  .bandeja {
    padding: 40px 32px;
  }

  .dropzone {
    border: 1.5px dashed var(--border);
    border-radius: 5px;
    padding: 32px 24px;
    text-align: center;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .dropzone:has(input:focus-visible) {
    border-color: var(--accent);
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .dropzone-titulo {
    font-size: 14.5px;
    font-weight: 500;
    color: var(--ink);
    margin: 0 0 4px;
  }

  .dropzone-detalle {
    font-size: 12.5px;
    color: var(--slate-light);
    margin: 0 0 20px;
    font-family: var(--font-mono);
  }

  input[type="file"] {
    display: block;
    margin: 0 auto 20px;
    font-family: var(--font-body);
    font-size: 13.5px;
    color: var(--slate);
    max-width: 340px;
  }

  button {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    background: var(--accent);
    color: white;
    border: none;
    padding: 11px 26px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: var(--accent-dark); }
  button:focus-visible { outline: 2px solid var(--accent-dark); outline-offset: 2px; }

  #resultado { margin-top: 20px; }

  .alerta {
    padding: 16px 18px;
    border-radius: 5px;
    font-size: 14px;
    border: 1px solid var(--danger-border);
    background: var(--danger-bg);
    color: var(--danger);
    animation: aparecer 0.2s ease-out;
  }

  .alerta strong { display: block; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }

  .registro {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 28px 28px 22px;
    animation: aparecer 0.2s ease-out;
    overflow: hidden;
  }

  .sello {
    position: absolute;
    top: 22px;
    right: 24px;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 3px;
    transform: rotate(-3deg);
    border: 1.5px solid;
  }

  .sello::before {
    content: "";
    position: absolute;
    inset: 3px;
    border: 1px solid;
    border-color: inherit;
    border-radius: 2px;
    opacity: 0.5;
  }

  .sello-activo { color: var(--success); border-color: var(--success); background: var(--success-bg); }
  .sello-inactivo { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }
  .sello-no_registrado { color: var(--warning); border-color: var(--warning); background: var(--warning-bg); }

  .registro-titulo {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--slate-light);
    margin: 0 0 2px;
  }

  .registro-nombre {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 18px;
    padding-right: 130px;
  }

  .ledger {
    border-top: 1px solid var(--border);
  }

  .ledger-fila {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
  }

  .ledger-fila:last-child { border-bottom: none; }

  .ledger-label {
    color: var(--slate);
    flex-shrink: 0;
  }

  .ledger-valor {
    font-family: var(--font-mono);
    color: var(--ink);
    text-align: right;
    word-break: break-all;
  }

  .ledger-valor.destacado {
    font-weight: 600;
    font-size: 14.5px;
  }

  @keyframes aparecer {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .alerta, .registro { animation: none; }
  }

  @media (max-width: 480px) {
    .registro-nombre { padding-right: 0; }
    .sello { position: static; display: inline-block; transform: none; margin-bottom: 14px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Sistema de procesamiento contable</p>
    <h1>Recepción de facturas</h1>
    <p class="subtitulo">Sube el XML de la factura electrónica. El sistema extrae los datos y valida al proveedor antes de continuar.</p>

    <div class="panel bandeja">
      <div class="dropzone">
        <p class="dropzone-titulo">Selecciona el archivo XML de la factura</p>
        <p class="dropzone-detalle">formato .xml · SRI Ecuador</p>
        <form hx-post="/subir" hx-target="#resultado" hx-encoding="multipart/form-data">
          <input type="file" name="archivo" accept=".xml" required>
          <button type="submit">Procesar factura</button>
        </form>
      </div>
    </div>

    <div id="resultado"></div>
  </div>
</body>
</html>
